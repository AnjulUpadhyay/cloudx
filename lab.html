<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cloudx // immersive — preview</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◇</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#000003; --text:#f4f6fb; --muted:#79808f; --neon:#6ee7ff; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:var(--bg); color:var(--text); font-family:"Sora",system-ui,sans-serif; overflow:hidden; cursor:none; }
    @media (pointer:coarse){ body{ cursor:auto; } }
    #gl { position:fixed; inset:0; z-index:0; display:block; }

    .cursor { position:fixed; top:0; left:0; z-index:9; width:32px; height:32px; margin:-16px 0 0 -16px;
      border:1px solid rgba(110,231,255,.6); border-radius:50%; pointer-events:none;
      transition:width .25s,height .25s,margin .25s,background .25s; mix-blend-mode:screen; }
    .cursor.big { width:62px; height:62px; margin:-31px 0 0 -31px; background:rgba(110,231,255,.08); }
    .cursor-dot { position:fixed; top:0; left:0; z-index:9; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
      background:var(--neon); border-radius:50%; pointer-events:none; }
    @media (pointer:coarse){ .cursor,.cursor-dot{ display:none; } }

    .loader { position:fixed; inset:0; z-index:20; background:var(--bg); display:flex;
      flex-direction:column; align-items:center; justify-content:center; gap:20px;
      transition:opacity 1s ease, visibility 1s; }
    .loader.done { opacity:0; visibility:hidden; }
    .count { font-family:"JetBrains Mono",monospace; font-size:clamp(2.6rem,9vw,5rem); font-weight:500; line-height:1; }
    .bar { width:min(220px,55vw); height:1px; background:rgba(255,255,255,.12); overflow:hidden; }
    .bar i { display:block; height:100%; width:0%; background:var(--neon); box-shadow:0 0 12px var(--neon); }
    .loadlbl { font-family:"JetBrains Mono",monospace; font-size:.68rem; letter-spacing:.42em; text-transform:uppercase; color:var(--muted); }

    .ui { position:fixed; inset:0; z-index:5; pointer-events:none; display:grid; grid-template-rows:auto 1fr auto; }
    .top { display:flex; align-items:center; justify-content:space-between; padding:30px clamp(24px,5vw,60px); }
    .top a { pointer-events:auto; text-decoration:none; }
    .brand { font-family:"JetBrains Mono",monospace; font-weight:500; letter-spacing:.12em; color:var(--text); font-size:1rem; }
    .brand b { color:var(--neon); font-weight:700; }
    .navlink { font-family:"JetBrains Mono",monospace; font-size:.8rem; letter-spacing:.1em; color:var(--muted); }
    .navlink:hover { color:var(--neon); }

    .foot { display:flex; justify-content:space-between; align-items:flex-end; padding:0 clamp(24px,5vw,60px) 34px; }
    .id { max-width:60ch; }
    .id .eyebrow { font-family:"JetBrains Mono",monospace; font-size:.72rem; letter-spacing:.34em; text-transform:uppercase;
      color:var(--neon); margin-bottom:14px; opacity:0; transform:translateY(16px);
      transition:opacity 1s .3s ease, transform 1s .3s cubic-bezier(.16,1,.3,1); }
    .id h1 { font-family:"Clash Display","Sora",sans-serif; font-size:clamp(2.6rem,7vw,5.6rem);
      font-weight:700; line-height:.94; letter-spacing:-.012em; overflow:hidden; }
    .id h1 span { display:inline-block; transform:translateY(110%); transition:transform 1.1s .4s cubic-bezier(.16,1,.3,1); }
    .id .role { margin-top:16px; color:var(--muted); font-weight:300; font-size:clamp(.95rem,1.4vw,1.12rem);
      opacity:0; transform:translateY(16px); transition:opacity 1s .6s ease, transform 1s .6s cubic-bezier(.16,1,.3,1); }
    .cta { margin-top:26px; display:flex; gap:18px; align-items:center;
      opacity:0; transform:translateY(16px); transition:opacity 1s .75s ease, transform 1s .75s cubic-bezier(.16,1,.3,1); }
    .cta a { font-family:"JetBrains Mono",monospace; font-size:.84rem; letter-spacing:.03em; text-decoration:none; pointer-events:auto; }
    .cta .primary { color:#001016; background:var(--neon); padding:13px 24px; border-radius:999px; font-weight:500;
      transition:transform .2s, box-shadow .2s; }
    .cta .primary:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(110,231,255,.3); }
    .cta .ghost { color:var(--muted); border-bottom:1px solid transparent; padding-bottom:3px; }
    .cta .ghost:hover { color:var(--text); border-color:var(--neon); }
    .tag { font-family:"JetBrains Mono",monospace; font-size:.68rem; letter-spacing:.1em; color:var(--muted);
      border:1px solid rgba(255,255,255,.1); padding:5px 12px; border-radius:999px; white-space:nowrap; }

    .ready .id .eyebrow, .ready .id .role, .ready .cta { opacity:1; transform:none; }
    .ready .id h1 span { transform:none; }

    @media (max-width:760px){ .foot{ flex-direction:column; align-items:flex-start; gap:18px; } }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="loader" id="loader">
    <div class="count" id="count">0</div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="loadlbl">cloudx // entering</div>
  </div>

  <div class="ui">
    <div class="top">
      <a class="brand" href="/">cloud<b>X</b></a>
      <a class="navlink" href="/">full site →</a>
    </div>
    <div></div>
    <div class="foot">
      <div class="id">
        <p class="eyebrow">Senior DevOps Engineer · AI</p>
        <h1><span>Anjul Upadhyay</span></h1>
        <p class="role">Cloud infrastructure, automation &amp; autonomous AI agent systems.</p>
        <div class="cta">
          <a class="primary" data-hover href="mailto:akanjulupadhyay@gmail.com">Get in touch</a>
          <a class="ghost" data-hover href="/">explore the work →</a>
        </div>
      </div>
      <span class="tag">cloudx // lab</span>
    </div>
  </div>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="lab.js?v=12"></script>
</body>
</html>
