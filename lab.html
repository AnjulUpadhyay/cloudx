<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cloudx // immersive — preview</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>○</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#080a0f; --ink:#0a0d13;
      --text:#eef2f8; --muted:#8b93a6;
      --accent:#7cc7ff; --accent2:#aab6ff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:var(--bg); color:var(--text); font-family:"Sora",system-ui,sans-serif; overflow:hidden; }
    #scene { position:fixed; inset:0; z-index:0; display:block; }
    /* faint vignette for depth */
    .vignette { position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }

    .overlay { position:fixed; inset:0; z-index:2; pointer-events:none;
      display:grid; grid-template-rows:auto 1fr auto; }
    .top { display:flex; align-items:center; justify-content:space-between;
      padding:26px clamp(22px,5vw,60px); }
    .logo { font-family:"JetBrains Mono",monospace; font-weight:500; font-size:1.05rem; letter-spacing:.04em;
      color:var(--text); text-decoration:none; pointer-events:auto; }
    .logo b { color:var(--accent); font-weight:700; }
    .back { font-family:"JetBrains Mono",monospace; font-size:.8rem; color:var(--muted);
      text-decoration:none; pointer-events:auto; letter-spacing:.04em; }
    .back:hover { color:var(--accent); }

    .hero { align-self:center; padding:0 clamp(22px,7vw,110px); max-width:760px; }
    .kicker { font-family:"JetBrains Mono",monospace; color:var(--accent); font-size:.82rem;
      letter-spacing:.34em; text-transform:uppercase; margin-bottom:22px;
      opacity:0; animation:rise 1s .2s cubic-bezier(.2,.7,.2,1) forwards; }
    h1 { font-size:clamp(2.6rem,7vw,5.4rem); font-weight:800; line-height:1.0; letter-spacing:-.025em;
      opacity:0; animation:rise 1s .35s cubic-bezier(.2,.7,.2,1) forwards; }
    h1 .thin { display:block; font-weight:300; font-size:.34em; letter-spacing:.02em; color:var(--muted);
      margin-bottom:.5em; }
    h1 .name2 { background:linear-gradient(110deg,var(--accent),var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { margin-top:26px; max-width:42ch; color:var(--muted); font-weight:300;
      font-size:clamp(1rem,1.5vw,1.18rem); line-height:1.7;
      opacity:0; animation:rise 1s .5s cubic-bezier(.2,.7,.2,1) forwards; }
    .cta { margin-top:34px; display:flex; gap:18px; align-items:center; pointer-events:auto;
      opacity:0; animation:rise 1s .65s cubic-bezier(.2,.7,.2,1) forwards; }
    .cta a { font-family:"JetBrains Mono",monospace; font-size:.86rem; text-decoration:none; letter-spacing:.03em; }
    .cta .primary { color:var(--bg); background:var(--accent); padding:12px 22px; border-radius:999px; font-weight:500;
      transition:transform .2s, box-shadow .2s; }
    .cta .primary:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(124,199,255,.3); }
    .cta .ghost { color:var(--muted); border-bottom:1px solid transparent; padding-bottom:2px; }
    .cta .ghost:hover { color:var(--text); border-color:var(--accent); }

    @keyframes rise { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:none; } }

    .foot { display:flex; justify-content:space-between; align-items:center;
      padding:20px clamp(22px,5vw,60px); font-family:"JetBrains Mono",monospace;
      font-size:.7rem; color:var(--muted); letter-spacing:.06em; }
    .foot .drag { opacity:.7; }
    .tag { border:1px solid rgba(255,255,255,.1); padding:4px 11px; border-radius:999px; background:rgba(255,255,255,.02); }

    .loading { position:fixed; inset:0; z-index:4; display:flex; align-items:center; justify-content:center;
      font-family:"JetBrains Mono",monospace; color:var(--muted); font-size:.85rem; letter-spacing:.1em;
      background:var(--bg); transition:opacity .8s ease; }
    .loading.hidden { opacity:0; pointer-events:none; }

    @media (max-width:820px) {
      .overlay { grid-template-rows:auto auto 1fr auto; }
      .hero { align-self:start; padding-top:8vh; }
      h1 { font-size:clamp(2.4rem,11vw,3.4rem); }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div class="loading" id="loading">forming…</div>

  <div class="overlay">
    <div class="top">
      <a class="logo" href="/">cloud<b>X</b></a>
      <a class="back" href="/">← full site</a>
    </div>
    <div class="hero">
      <p class="kicker">immersive preview · WIP</p>
      <h1><span class="thin">Hi, I'm</span>Anjul <span class="name2">Upadhyay</span></h1>
      <p class="sub">Senior DevOps Engineer &amp; AI agent builder. Cloud infrastructure,
        automation, and autonomous multi-agent systems — crafted with care.</p>
      <div class="cta">
        <a class="primary" href="mailto:akanjulupadhyay@gmail.com">Get in touch</a>
        <a class="ghost" href="/">explore the full site →</a>
      </div>
    </div>
    <div class="foot">
      <span class="drag">drag · move the cursor</span>
      <span class="tag">cloudx // lab</span>
    </div>
  </div>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="lab.js"></script>
</body>
</html>
