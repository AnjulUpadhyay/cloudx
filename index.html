<body>
  <div class="crt" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- SEO / accessibility fallback -->
  <h1 class="sr-only">Anjul Upadhyay — Senior DevOps Engineer &amp; AI Agent Builder, Bengaluru</h1>
  <noscript>
    <div class="noscript">
      <h2>Anjul Upadhyay — Senior DevOps Engineer (Oracle, Bengaluru)</h2>
      <p>7+ years in cloud &amp; DevOps across OCI, GCP, AWS and OpenStack. Kubernetes, Terraform,
      Jenkins, CI/CD, observability, and autonomous AI agent systems (LangChain, LangGraph).</p>
      <p>Email: <a href="mailto:akanjulupadhyay@gmail.com">akanjulupadhyay@gmail.com</a> ·
      GitHub: <a href="https://github.com/AnjulUpadhyay">AnjulUpadhyay</a> ·
      LinkedIn: <a href="https://www.linkedin.com/in/anjul-upadhyay-2328b69a/">anjul-upadhyay</a></p>
      <p>This site is an interactive terminal — please enable JavaScript to explore it.</p>
    </div>
  </noscript>

  <main class="term-window" id="win">
    <div class="title-bar">
      <span class="lights"><i class="l red"></i><i class="l yellow"></i><i class="l green"></i></span>
      <span class="title">anjul@cloudx&nbsp;:&nbsp;~ — cloudx.os</span>
      <span class="theme-picker" id="theme-picker" title="Color scheme — or type: theme nebula">
        <button class="theme-dot" data-theme="midnight" aria-label="Midnight theme"></button>
        <button class="theme-dot" data-theme="nebula" aria-label="Nebula theme"></button>
        <button class="theme-dot" data-theme="aurora" aria-label="Aurora theme"></button>
        <button class="theme-dot" data-theme="synthwave" aria-label="Synthwave theme"></button>
      </span>
    </div>

    <div class="screen" id="screen">
      <div class="output" id="output"></div>
      <div class="prompt-line" id="prompt-line" hidden>
        <span class="ps1"><span class="u">anjul@cloudx</span><span class="c">:</span><span class="p">~</span><span class="c">$</span>&nbsp;</span><span class="cmd" id="cmd-text"></span><span class="cursor" id="cursor">▋</span>
      </div>
    </div>

    <div class="chips" id="chips" aria-label="quick commands">
      <button data-cmd="about">about</button>
      <button data-cmd="skills">skills</button>
      <button data-cmd="experience">experience</button>
      <button data-cmd="projects">projects</button>
      <button data-cmd="brahmaand">brahmaand</button>
      <button data-cmd="contact">contact</button>
      <button data-cmd="help">help</button>
    </div>
  </main>

  <input id="stdin" class="sr-input" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" aria-label="terminal command input" />

  <script src="script.js"></script>
</body>
